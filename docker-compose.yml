services:
  sf2-harness:
    build: .
    container_name: sf2-harness
    environment:
      # Target emulator / container settings
      - ANDROID_SERIAL=127.0.0.1:5555
      - ADB_PATH=/usr/bin/adb
      - ADB_CONNECT=127.0.0.1:5555
      - FRIDA_HOST=127.0.0.1
      - FRIDA_PORT=27042
      - FRIDA_DIRECT=0
    stdin_open: true
    tty: true